server {
  listen 80;
  server_name _;
  client_max_body_size 256k;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Re-resolve the backend address on every request so a recreated backend
    # container (new IP) does not leave nginx pinned to a dead upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ /index.html; }
}
